# Production stack for a single VPS: Caddy (HTTPS) → web, plus the worker and Postgres.
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
# Moving to AWS later: web → ECS service behind an ALB, worker → ECS service with 1 task,
# migrate → one-off ECS task, postgres → RDS. The image and env variables stay the same.

x-app: &app
  image: slotty-app:latest
  build: ..
  env_file: .env
  environment:
    DATABASE_URL: postgres://slotty:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/slotty
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: slotty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: slotty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotty -d slotty"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations on every `up`, then exits; web and worker wait for it.
  migrate:
    <<: *app
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      start_period: 20s
      retries: 3

  # One worker is plenty; jobs claim their rows, so extra workers would share work, not duplicate it.
  worker:
    <<: *app
    command: ["bun", "src/jobs/worker.ts"]
    # Lets it finish the batch it's sending on deploy/restart (it force-exits after 25s).
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
