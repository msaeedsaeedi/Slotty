# Builds the system documentation (docs/) when it changes, and keeps the PDF as a build artifact.
# A document that doesn't build fails like code that doesn't compile.
name: Docs

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the PDF (pinned TeX Live image)
        run: docs/tooling/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slotty-docs-${{ github.sha }}
          path: docs/build/slotty.pdf
          if-no-files-found: error
