# Checks every pull request (required by dev's and master's protection: the "CI ok" job). Pushes
# aren't checked again: protection makes a PR be up to date and green before it merges, so dev and
# master hold only what CI already tested (deploy.yml doesn't wait for CI either). A "changes" job
# decides what a PR needs: docs-only PRs skip the tests, the images build only when what goes into
# them changed, and Back-merge PRs (master, already tested, back into dev) run only the fast checks.
# PRs into master are releases and must also pass "Release PR" (ADR-027). On the Back-merge
# workflow's PRs CI runs once a maintainer approves it (GitHub's rule for PRs opened by a workflow).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` (postinstall) loads its config, which needs a URL; nothing connects.
  DATABASE_URL: postgres://ci@localhost/ci
  BUN_VERSION: 1.3.14

jobs:
  changes:
    # What this PR touches. A manual run (workflow_dispatch) checks everything.
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
      docs: ${{ steps.diff.outputs.docs }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Back-merge PRs bring master, which CI already tested, into dev: fast checks only.
          case $HEAD_REF in back-merge/*) full=false ;; *) full=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ -z "$BASE" ]; then
            printf 'code=true\nimage=true\ndocs=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          {
            echo "code=$(grep -qv '^docs/' <<<"$files" && echo true || echo false)"
            echo "image=$(has '^(Dockerfile|\.dockerignore|docker-bake\.hcl|docker/|package\.json|bun\.lock|prisma/)')"
            echo "docs=$(has '^docs/')"
          } >> "$GITHUB_OUTPUT"

  checks:
    # One job, so dependencies install once and the minute rounding is paid once.
    name: Typecheck, lint, unit and integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run test:int
      # Fails on any high or critical advisory in either lockfile (root and the migrate image's),
      # except the accepted ones listed in the `audit` script (ADR-034, docs ch. 11).
      - name: Dependency audit
        run: bun run audit

  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      # Next's build cache for the e2e build (.next-e2e, see playwright.config.ts).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ hashFiles('bun.lock') }}-
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    # Proves the Dockerfile still builds (both targets) before it can merge. Pushing happens
    # only in deploy.yml, on master. Native ARM64, like Fargate.
    name: Docker images
    needs: changes
    if: needs.changes.outputs.image == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          push: false
          provenance: false
          # Reads master's layer cache; PRs don't write to it.
          set: |
            app.cache-from=type=gha,scope=app
            migrate.cache-from=type=gha,scope=migrate

  docs:
    # Builds the system documentation when docs/ changed (a document that doesn't build fails like
    # code that doesn't compile) and keeps the PDF as an artifact.
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the PDF (pinned TeX Live image)
        run: docs/tooling/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slotty-docs-${{ github.sha }}
          path: docs/build/slotty.pdf
          if-no-files-found: error

  release-pr:
    # A PR into master is a release: from dev (or a hotfix/ or revert- branch), with a version in
    # package.json that master doesn't have and no tag has taken yet.
    name: Release PR
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Source branch, version and tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case $HEAD_REF in
            dev|hotfix/*|revert-*) ;;
            *) echo "::error::master takes release PRs from dev (or hotfix/*, revert-*), not from $HEAD_REF. Target dev instead."; exit 1 ;;
          esac
          version="v$(jq -r .version package.json)"
          base="v$(git show "$BASE_SHA:package.json" | jq -r .version)"
          if [ "$version" = "$base" ]; then
            echo "::error::package.json still says $version, like master. Bump the version: merging this PR releases it."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged. Pick the next version."; exit 1
          fi
          echo "Merging releases $version (master has $base)."

  # The one check branch protection requires: green only if every job above passed (or was
  # skipped by design), so adding a job never needs a settings change.
  ok:
    name: CI ok
    if: always()
    needs: [changes, checks, e2e, image, docs, release-pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in success|skipped) ;; *) exit 1 ;; esac
          done
