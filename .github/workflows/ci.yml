# Checks every pull request (required by dev's and master's protection: the "CI ok" job) and every
# push to dev and master. Jobs run in parallel; each database is a throwaway Postgres
# (Testcontainers). PRs into master are releases and must also pass "Release PR" (ADR-027).
# Deploying is .github/workflows/deploy.yml, which doesn't wait for this: protection makes a PR be
# up to date and green before it merges, so master is what CI already tested. The back-merge
# workflow starts this by hand (workflow_dispatch) on the branch it opens, since a PR opened by
# the workflow token starts no workflow itself.
name: CI

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; master runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `prisma generate` (postinstall) loads its config, which needs a URL; nothing connects.
  DATABASE_URL: postgres://ci@localhost/ci
  BUN_VERSION: 1.3.14

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run test:int

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      # Next's build cache for the e2e build (.next-e2e, see playwright.config.ts).
      - uses: actions/cache@v6.1.0
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ hashFiles('bun.lock') }}-
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    # Proves the Dockerfile still builds (both targets) before it can merge. Pushing happens
    # only in deploy.yml, on master. Native ARM64, like Fargate.
    name: Docker images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/bake-action@v7.5.0
        with:
          source: .
          push: false
          provenance: false
          # Reads master's layer cache; PRs don't write to it.
          set: |
            app.cache-from=type=gha,scope=app
            migrate.cache-from=type=gha,scope=migrate

  docs:
    # Builds the system documentation when docs/ changed (a document that doesn't build fails like
    # code that doesn't compile) and keeps the PDF as an artifact.
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Did docs/ change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git fetch -q --depth=1 origin "$BASE" && git diff --quiet "$BASE" HEAD -- docs/; then
            echo "docs=false" >> "$GITHUB_OUTPUT"; echo "docs/ unchanged; nothing to build."
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the PDF (pinned TeX Live image)
        if: steps.changed.outputs.docs == 'true'
        run: docs/tooling/build.sh
      - uses: actions/upload-artifact@v7.0.2
        if: steps.changed.outputs.docs == 'true'
        with:
          name: slotty-docs-${{ github.sha }}
          path: docs/build/slotty.pdf
          if-no-files-found: error

  release-pr:
    # A PR into master is a release: from dev (or a hotfix/ or revert- branch), with a version in
    # package.json that master doesn't have and no tag has taken yet.
    name: Release PR
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Source branch, version and tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case $HEAD_REF in
            dev|hotfix/*|revert-*) ;;
            *) echo "::error::master takes release PRs from dev (or hotfix/*, revert-*), not from $HEAD_REF. Target dev instead."; exit 1 ;;
          esac
          version="v$(jq -r .version package.json)"
          base="v$(git show "$BASE_SHA:package.json" | jq -r .version)"
          if [ "$version" = "$base" ]; then
            echo "::error::package.json still says $version, like master. Bump the version: merging this PR releases it."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged. Pick the next version."; exit 1
          fi
          echo "Merging releases $version (master has $base)."

  # The one check branch protection requires: green only if every job above passed (or was
  # skipped by design), so adding a job never needs a settings change.
  ok:
    name: CI ok
    if: always()
    needs: [static, integration, e2e, image, docs, release-pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in success|skipped) ;; *) exit 1 ;; esac
          done
