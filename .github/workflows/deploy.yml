# Checks every push and pull request; deploys master to AWS (infra/aws).
# Repository variables (Settings → Secrets and variables → Actions → Variables) come from
# `terraform output github_actions_variables` in infra/aws/app. Until AWS_DEPLOY_ROLE_ARN is
# set, only the checks run.
name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # `prisma generate` loads its config, which needs a URL; nothing connects.
      DATABASE_URL: postgres://ci@localhost/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    # Native ARM64 build for Graviton Fargate (free for public repositories).
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable: a re-run of the same commit reuses its images.
      - name: Already built?
        id: exists
        run: |
          repo="${ECR_REPOSITORY#*/}"
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGE_TAG" imageTag="$IMAGE_TAG-migrate" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.built != 'true'

      - name: Build and push the app image
        if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrate image
        if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-migrate
          cache-from: type=gha

      - name: Migrate and roll out
        run: infra/aws/deploy.sh
