# GitOps (ADR-027): master is production. Every push to master (a release PR from dev, a hotfix or
# a revert, each with a new version in package.json) builds, migrates and rolls out, and only once
# /health reports the new version does it tag vX.Y.Z and publish the GitHub Release. Work collects
# on dev, which deploys nothing. It doesn't re-run CI: master only takes PRs that are up to date and
# green ("CI ok"), so the commit is one CI tested (ADR-022).
# Run it by hand from a tag ("Use workflow from" → Tags) to redeploy a release or, with `rollback`,
# go back to an older one in an emergency; a revert PR into master is the normal way back.
# Repository variables (Settings → Secrets and variables → Actions → Variables) come from
# `terraform output github_actions_variables` in infra/aws/app; until they're set, nothing runs.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback:
        description: Deploy this release even though a newer one is live (skips migrations)
        type: boolean
        default: false
      force_migrate:
        description: Run the migrate task even if prisma/migrations didn't change
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The commit; images are tagged with it.
  IMAGE_TAG: ${{ github.sha }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

# One deploy at a time, in order; a newer push waits rather than cancelling one mid-rollout.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images
    # master, or a release tag run by hand; the build role trusts exactly those two.
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && vars.AWS_BUILD_ROLE_ARN != ''
    # Native ARM64 for Graviton Fargate (free for public repositories).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release is "v" + package.json's version. From master it must be new (the tag comes
      # after a healthy rollout); from a tag it must match, on a commit that's on master.
      - name: Check the release
        id: release
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              if [ "$(git rev-parse "$version^{commit}" 2>/dev/null)" = "$IMAGE_TAG" ]; then
                echo "$version is this commit: redeploying it"
              else
                echo "::error::$version is already released. A change to master needs a new version in package.json (the release PR's check enforces this)."; exit 1
              fi
            fi
          else
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::package.json says $version but the tag is $GITHUB_REF_NAME"; exit 1
            fi
            if ! git merge-base --is-ancestor "$IMAGE_TAG" origin/master; then
              echo "::error::$GITHUB_REF_NAME ($IMAGE_TAG) is not on master"; exit 1
            fi
          fi
          echo "release=$version" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # Tags are immutable: a re-run of the same commit reuses its images.
      - name: Already built?
        id: exists
        run: |
          repo="${ECR_REPOSITORY#*/}"
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGE_TAG" imageTag="$IMAGE_TAG-migrate" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.built != 'true'

      # Both images in one run (docker-bake.hcl): shared stages build once.
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        if: steps.exists.outputs.built != 'true'
        env:
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          TAG: ${{ env.IMAGE_TAG }}
        with:
          source: .
          push: true
          provenance: false
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,mode=max,scope=app
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,mode=max,scope=migrate

  rollout:
    name: Migrate and roll out
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Its own approval rules, history and the OIDC subject the deploy role trusts. The
    # environment's deployment rules allow master and v* tags only.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
      APP_URL: ${{ vars.APP_URL }}
      RELEASE: ${{ needs.build.outputs.release }}
      FORCE_MIGRATE: ${{ inputs.force_migrate && '1' || '' }}
      ROLLBACK: ${{ inputs.rollback && '1' || '' }}
    steps:
      # Full history: deploy.sh compares this commit with the running release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Migrate and roll out
        run: infra/aws/deploy.sh

  release:
    # Only after /health reported the new version: a tag means "this went live". A failed rollout
    # leaves no tag, and master shows the change that didn't make it (fix forward or revert).
    name: Tag and publish the release
    needs: [build, rollout]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.build.outputs.release }}
    steps:
      - name: Publish ${{ needs.build.outputs.release }}
        run: |
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE is already published (a redeploy)"; exit 0
          fi
          pre=""; case $RELEASE in *-*) pre="--prerelease" ;; esac
          # Notes are generated from the merged PRs' labels (.github/release.yml). Created with the
          # workflow's token, so it doesn't start any other workflow.
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Uniflow ${RELEASE#v}" --generate-notes $pre
