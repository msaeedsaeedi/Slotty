# Bun (pinned) and the project's dependencies, with Bun's package cache kept between runs.
name: Set up Bun and dependencies
description: Install the pinned Bun and run `bun install --frozen-lockfile` with a cached package store.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
